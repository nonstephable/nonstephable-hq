.overall-pct{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:600;color:var(--dark)}

.log-entries{display:flex;flex-direction:column;gap:8px}
.log-entry{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;background:#faf9fe;border-radius:10px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.log-dot{width:8px;height:8px;border-radius:50%;background:var(--purple);flex-shrink:0;margin-top:4px}

.confetti-burst{position:fixed;pointer-events:none;top:0;left:0;width:100%;height:100%;z-index:999}
.confetti-piece{position:absolute;width:8px;height:8px;border-radius:2px;animation:confettiFall 1.2s ease-in forwards}
@keyframes confettiFall{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(300px) rotate(720deg)}}
</style>

function getDueBadge(dueStr,isDone){if(!dueStr)return'';if(isDone)return'<span class="due-badge due-done">Done</span>';const today=new Date();today.setHours(0,0,0,0);const due=new Date(dueStr);due.setHours(0,0,0,0);const diff=Math.ceil((due-today)/86400000);const label=due.toLocaleDateString('en-US',{month:'short',day:'numeric'});if(diff<0)return`<span class="due-badge due-red">Overdue · ${label}</span>`;if(diff===0)return'<span class="due-badge due-red">Today!</span>';if(diff<=3)return`<span class="due-badge due-yellow">${label}</span>`;return`<span class="due-badge due-green">${label}</span>`;}

function updateMaster(){let total=0,done=0;INITIATIVES.forEach(i=>{const s=getStats(i);total+=s.total;done+=s.done;});const pct=total?Math.round(done/total*100):0;document.getElementById('masterFill').style.width=pct+'%';document.getElementById('totalDone').textContent=done;document.getElementById('totalAll').textContent=total;const msgs=[[0,"0% — let's go Stephie! 🚀"],[1,`${pct}% — momentum is building! 🔥`],[50,`${pct}% — over halfway there! 💪`],[75,`${pct}% — almost there!! 🙌`],[100,'100% — YOU DID IT!! Happy Birthday! 🎂🎉']];document.getElementById('overallMsg').textContent=(msgs.filter(([t])=>pct>=t).pop()||msgs[0])[1];}
function confetti(x,y){const colors=['#9691ED','#F2ACEB','#BEE5EE','#B89CED','#FFF5D4','#7ecfa0'];const burst=document.createElement('div');burst.className='confetti-burst';document.body.appendChild(burst);for(let i=0;i<14;i++){const p=document.createElement('div');p.className='confetti-piece';p.style.cssText=`left:${x+(Math.random()-.5)*70}px;top:${y+(Math.random()-.5)*30}px;background:${colors[i%colors.length]};animation-delay:${Math.random()*.2}s;animation-duration:${.9+Math.random()*.5}s`;burst.appendChild(p);}setTimeout(()=>burst.remove(),1500);}
function renderInitiatives(){const anchor=document.querySelector('.section-label');INITIATIVES.forEach(init=>{const s=getStats(init);const pct=s.total?Math.round(s.done/s.total*100):0;const dd=state[init.id]?.done||[];const el=document.createElement('div');el.className=`initiative ${init.cls}`;el.id=`init-${init.id}`;const tHTML=init.tasks.map((task,i)=>isDiv(task)?`<div class="task-divider">${task.div}</div>`:`<div class="task-item${dd.includes(i)?' done':''}" onclick="toggleTask('${init.id}',${i},event)"><div class="task-check"><svg viewBox="0 0 12 10" fill="none"><polyline points="1,5 4,8 11,1"/></svg></div><div class="task-body"><div class="task-text">${task.t}</div>${getDueBadge(task.due,dd.includes(i))}</div></div>`).join('');el.innerHTML=`<div class="init-header" onclick="toggleInit('${init.id}')"><div class="init-top"><div class="init-title-row"><span class="init-emoji">${init.emoji}</span><div><div class="init-title">${init.title}</div><div class="init-deadline">${init.deadline}</div></div></div><div style="display:flex;align-items:center"><div class="init-pct" id="pct-${init.id}">${pct}%</div><div class="init-chevron">▼</div></div></div><div class="init-bar"><div class="init-fill" id="bar-${init.id}" style="width:${pct}%"></div></div></div><div class="task-list" id="tasks-${init.id}">${tHTML}</div>`;anchor.after(el);});}
function toggleInit(id){document.getElementById(`init-${id}`).classList.toggle('open');}
function toggleTask(initId,taskIdx,e){const init=INITIATIVES.find(i=>i.id===initId);if(isDiv(init.tasks[taskIdx]))return;const done=state[initId].done;const idx=done.indexOf(taskIdx);if(idx===-1){done.push(taskIdx);confetti(e.clientX,e.clientY);}else{done.splice(idx,1);}save();refreshUI();}
function refreshUI(){INITIATIVES.forEach(init=>{const s=getStats(init);const pct=s.total?Math.round(s.done/s.total*100):0;const dd=state[init.id]?.done||[];document.getElementById(`pct-${init.id}`).textContent=pct+'%';document.getElementById(`bar-${init.id}`).style.width=pct+'%';const els=document.querySelectorAll(`#tasks-${init.id} .task-item`);let ei=0;init.tasks.forEach((t,i)=>{if(isDiv(t))return;const el=els[ei++];if(!el)return;const isDone=dd.includes(i);isDone?el.classList.add('done'):el.classList.remove('done');const b=el.querySelector('.due-badge');const nb=getDueBadge(t.due,isDone);if(b)b.outerHTML=nb;else if(nb)el.querySelector('.task-body').insertAdjacentHTML('beforeend',nb);});});updateMaster();}
function addLog(){const input=document.getElementById('logInput');const text=input.value.trim();if(!text)return;const date=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});state.log.unshift({date,note:text});if(state.log.length>30)state.log.pop();save();input.value='';renderLog();}
function renderLog(){const el=document.getElementById('logEntries');if(!state.log.length){el.innerHTML='<div class="log-empty">No entries yet — log your first win! 🌟</div>';return;}el.innerHTML=state.log.map(e=>`<div class="log-entry"><div class="log-dot"></div><div style="flex:1"><div class="log-date">${e.date}</div><div class="log-note">${e.note}</div></div></div>`).join('');}
updateCountdowns();renderInitiatives();updateMaster();
document.body.insertAdjacentHTML('beforeend',`<div class="section-label" style="margin-top:24px;">Progress Log</div><div class="log-section"><div class="log-box"><div class="log-input-row"><input id="logInput" class="log-input" placeholder="Log a win, a note, a milestone..." onkeydown="if(event.key==='Enter')addLog()"><button class="log-btn" onclick="addLog()">+ LOG</button></div><div class="log-entries" id="logEntries"></div></div></div>`);
renderLog();
document.getElementById('init-flowkit').classList.add('open');
</script>
</body>
</html>
