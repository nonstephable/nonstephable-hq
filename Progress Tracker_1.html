<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NonStephable HQ — Progress Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@300;400;600;700&display=swap');

:root {
  --purple: #9691ED; --pink: #F2ACEB; --blue: #BEE5EE;
  --cream: #FFF5D4; --lavender: #B89CED; --dark: #3d2e8a;
  --text: #2a2040; --muted: #8a82b0; --green: #7ecfa0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--cream); font-family: 'Josefin Sans', sans-serif; color: var(--text); min-height: 100vh; padding: 0 0 60px; }

.hero { background: var(--dark); padding: 36px 28px 28px; position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; top: -40px; right: -40px; width: 200px; height: 200px; border-radius: 50%; background: rgba(146,145,237,0.15); }
.hero::after { content: ''; position: absolute; bottom: -20px; left: 30px; width: 120px; height: 120px; border-radius: 50%; background: rgba(242,172,235,0.1); }
.hero-label { font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase; color: var(--lavender); margin-bottom: 8px; }
.hero h1 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; color: var(--cream); font-weight: 400; line-height: 1.2; }
.hero h1 span { color: var(--pink); font-style: italic; }
.hero-sub { font-size: 0.65rem; letter-spacing: 1.5px; color: rgba(255,245,212,0.45); margin-top: 6px; text-transform: uppercase; }

.overall { background: white; margin: 20px 20px 0; border-radius: 18px; padding: 20px 22px; box-shadow: 0 2px 20px rgba(61,46,138,0.08); }
.overall-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.overall-title { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.overall-pct { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 600; color: var(--dark); }
.overall-pct span { font-size: 1rem; color: var(--muted); }
.master-bar { height: 10px; background: #f0edf9; border-radius: 10px; overflow: hidden; }
.master-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--purple), var(--pink)); transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
.overall-msg { font-size: 0.62rem; color: var(--muted); margin-top: 8px; letter-spacing: 0.5px; }

.countdown-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 14px 20px 0; }
.countdown-card { background: white; border-radius: 14px; padding: 14px 12px; text-align: center; box-shadow: 0 2px 12px rgba(61,46,138,0.07); border-bottom: 3px solid var(--purple); }
.countdown-card:nth-child(2) { border-bottom-color: var(--pink); }
.countdown-card:nth-child(3) { border-bottom-color: var(--blue); }
.countdown-num { font-family: 'Cormorant Garamond', serif; font-size: 1.9rem; font-weight: 600; color: var(--dark); line-height: 1; }
.countdown-label { font-size: 0.55rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-top: 4px; line-height: 1.4; }

.section-label { font-size: 0.62rem; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); margin: 24px 20px 10px; }
.initiative { background: white; margin: 0 20px 14px; border-radius: 18px; overflow: hidden; box-shadow: 0 2px 16px rgba(61,46,138,0.07); }
.init-header { padding: 18px 20px 14px; border-bottom: 1px solid #f5f3fc; cursor: pointer; user-select: none; }
.init-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.init-title-row { display: flex; align-items: center; gap: 10px; }
.init-emoji { font-size: 1.3rem; }
.init-title { font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; font-weight: 600; color: var(--dark); }
.init-deadline { font-size: 0.58rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-top: 1px; }
.init-pct { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 600; color: var(--dark); white-space: nowrap; }
.init-chevron { font-size: 0.75rem; color: var(--muted); transition: transform 0.3s ease; margin-left: 8px; }
.initiative.open .init-chevron { transform: rotate(180deg); }
.init-bar { height: 6px; background: #f0edf9; border-radius: 6px; overflow: hidden; }
.init-fill { height: 100%; border-radius: 6px; transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
.i0 .init-fill { background: linear-gradient(90deg, #F2ACEB, #d879c8); }
.i1 .init-fill { background: linear-gradient(90deg, #9691ED, #7d78d4); }
.i2 .init-fill { background: linear-gradient(90deg, #BEE5EE, #6aacba); }
.i3 .init-fill { background: linear-gradient(90deg, #B89CED, #9d7fe0); }
.i4 .init-fill { background: linear-gradient(90deg, #7ecfa0, #4db87a); }

.task-list { display: none; padding: 4px 0 8px; }
.initiative.open .task-list { display: block; }
.task-item { display: flex; align-items: flex-start; gap: 14px; padding: 10px 20px; cursor: pointer; transition: background 0.15s ease; }
.task-item:hover { background: #faf9fe; }
.task-check { width: 20px; height: 20px; border-radius: 6px; border: 2px solid #ddd8f5; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; background: white; }
.task-item.done .task-check { background: var(--green); border-color: var(--green); }
.task-check svg { width: 11px; height: 11px; stroke: white; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform: scale(0.5); transition: all 0.2s ease; }
.task-item.done .task-check svg { opacity: 1; transform: scale(1); }
.task-text { font-size: 0.73rem; line-height: 1.5; color: var(--text); transition: all 0.2s ease; flex: 1; }
.task-item.done .task-text { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(126,207,160,0.6); }
.task-divider { font-size: 0.58rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--purple); padding: 10px 20px 2px; font-weight: 600; border-top: 1px solid #f0edf9; margin-top: 4px; }

.log-section { margin: 0 20px; }
.log-box { background: white; border-radius: 18px; padding: 18px 20px; box-shadow: 0 2px 16px rgba(61,46,138,0.07); }
.log-input-row { display: flex; gap: 10px; margin-bottom: 14px; }
.log-input { flex: 1; border: 1.5px solid #ede9fa; border-radius: 10px; padding: 10px 14px; font-family: 'Josefin Sans', sans-serif; font-size: 0.72rem; color: var(--text); background: #faf9fe; outline: none; transition: border-color 0.2s; }
.log-input:focus { border-color: var(--purple); }
.log-input::placeholder { color: #c5bfe8; }
.log-btn { background: var(--dark); color: var(--cream); border: none; border-radius: 10px; padding: 10px 16px; font-family: 'Josefin Sans', sans-serif; font-size: 0.68rem; font-weight: 600; letter-spacing: 1px; cursor: pointer; white-space: nowrap; transition: background 0.2s; }
.log-btn:hover { background: var(--purple); }
.log-entries { display: flex; flex-direction: column; gap: 8px; }
.log-entry { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; background: #faf9fe; border-radius: 10px; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
.log-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--purple); flex-shrink: 0; margin-top: 4px; }
.log-date { font-size: 0.58rem; letter-spacing: 1px; color: var(--muted); white-space: nowrap; margin-top: 2px; }
.log-note { font-size: 0.7rem; line-height: 1.5; color: var(--text); flex: 1; }
.log-empty { font-size: 0.7rem; color: var(--muted); font-style: italic; text-align: center; padding: 12px 0; }

.confetti-burst { position: fixed; pointer-events: none; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; }
.confetti-piece { position: absolute; width: 8px; height: 8px; border-radius: 2px; animation: confettiFall 1.2s ease-in forwards; }
@keyframes confettiFall { 0% { opacity: 1; transform: translateY(0) rotate(0deg); } 100% { opacity: 0; transform: translateY(300px) rotate(720deg); } }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-label">NonStephable & Co.</div>
  <h1>HQ Progress <span>Tracker</span></h1>
  <div class="hero-sub">Apr 26 – May 25, 2026 · 32nd Birthday Sprint</div>
</div>

<div class="overall">
  <div class="overall-top">
    <div class="overall-title">Overall Progress</div>
    <div class="overall-pct"><span id="totalDone">0</span>/<span id="totalAll">0</span> <span>tasks</span></div>
  </div>

<div class="countdown-row">

<div class="section-label">Initiatives</div>

<script>
// ── DATA ──────────────────────────────────────────────

const INITIATIVES = [

      'Drop on May 11 🌸'
    ]
  },
  {
    id: 'flowkit', emoji: '📦', title: 'F.L.O.W. Kit Go Live',
    deadline: 'Target · Apr 28', cls: 'i1',
    tasks: [
      DIVIDER + 'Gumroad Setup',
      'Create Gumroad account',
      'Upload the Inbox F.L.O.W. Kit files',
      'Set up 3 price tiers ($9 Starter / $27 Full Kit / $47 Done-With-You)',
      'Copy your Gumroad product link',
      DIVIDER + 'GHL Sales Page',
      'Swap CTA button URL on GHL page to Gumroad link',
      'Test purchase flow end-to-end',
      DIVIDER + 'Automation (Gumroad → GHL)',
      'Set up Zapier zap: Gumroad new sale → GHL new contact',
      'Tag buyers automatically in GHL',
      'Fire welcome/onboarding sequence on purchase',
      DIVIDER + 'Launch',
      'Link in bio live on nonsteph.com',
      'One IG post announcing the kit',
      'One story driving to the link'
    ]
  },
  {
    id: 'funnels', emoji: '🎂', title: '32 Funnels for 32',
    deadline: 'Build by May 21 · Launch May 25', cls: 'i2',
    tasks: [
      'List 32 cafes / hotels / coworks',
      'Write DM outreach script',
      'Build funnels batch 1 (7 funnels)',
      'Build funnels batch 2 (7 funnels)',
      'Build funnels batch 3 (7 funnels)',
      'Build funnels batch 4 (7 funnels)',
      'Build funnels batch 5 (4 funnels)',
      'Write birthday announcement caption',
      'Schedule content queue (1 reveal/day)',
      'Launch on birthday May 25 🎂'
    ]
  },
  {
    id: 'ghl', emoji: '📚', title: 'GHL4Beginners — 30-Day Plan',
    deadline: 'Started Apr 20 · Graduation May 19', cls: 'i3',
    tasks: [
      'Day 1 (Apr 20) — Welcome + M0-L1: What is GHL?',
      'Day 2 (Apr 21) — M0: Business Models, CRM Overview, Account Types Quiz',
      'Day 3 (Apr 22) — M1: What is a CRM? Why Automation Fails Without Process',
      'Day 4 (Apr 23) — M1 Assignment: Build YOUR Sales Process Map',
      'Day 5 (Apr 24) — M1 Checklist + M2: Business Profile Setup (hands-on)',
      'Day 6 (Apr 25) — 100K Automation Workshop Part 1 (watch 2 hrs)',
      DIVIDER + 'Week 1 Reflection',
      'Day 7 (Apr 26) — 100K Workshop Part 2 + sketch full flow from memory',
      'Day 8 (Apr 27) — M2: Users & Permissions + What is a Domain?',
      'Day 9 (Apr 28) — M2: Connect Branded Domain + Email Sub-Domain (critical!)',
      'Day 10 (Apr 29) — M2: Core Integrations — Google, Facebook, Zapier',
      'Day 11 (Apr 30) — M2: Zapier + A2P SMS Compliance (know this cold)',
      'Day 12 (May 1) — M2: Phone Numbers + GHL Email System + Metrics',
      'Day 13 (May 2) — M2: Stripe Payment + Brand Board + Module 2 Quiz',
      'Day 14 (May 3) — M3: Getting Contacts Into GHL — Manual + Bulk Import',
      DIVIDER + 'Week 2 Reflection',
      'Day 15 (May 4) — M3: Custom Fields + Contact View (hands-on)',
      'Day 16 (May 5) — M3→M4: Custom Values + Build First Form',
      'Day 17 (May 6) — M4: Surveys, Quizzes + Calendar Intro',
      'Day 18 (May 7) — M4: Build Your Booking Calendar (test with real booking!)',
      'Day 19 (May 8) — M4: Funnel Theory + Watch the Build (pause & take notes)',
      'Day 20 (May 9) — M4: BUILD Your First Funnel + Chat Widget 🚀',
      'Day 21 (May 10) — M4→M5: QR Codes + SMS & Email Templates',
      DIVIDER + 'Week 3 Reflection',
      'Day 22 (May 11) — M5: Email Snippets Deep Dive (build 3 templates)',
      'Day 23 (May 12) — M5: Email Templates + Document & Contract Templates',
      'Day 24 (May 13) — M5→M6: Trigger Links + Pipeline Theory',
      'Day 25 (May 14) — M6: BUILD Your Sales Pipeline 🏗',
      'Day 26 (May 15) — M7: Automation Mindset — Triggers vs Actions vs Conditions',
      'Day 27 (May 16) — M7: Workflow Builder Walkthrough + First Workflow Watch',
      'Day 28 (May 17) — M7: BUILD & TEST Your First Automation ⚡',
      DIVIDER + 'Week 4 Reflection',
      'Day 29 (May 18) — M7→M8: GO LIVE 🎉 + Conversations Tab + Invoices',
      'Day 30 (May 19) — M8→M9: Products, Coupons, Dashboard + FINAL QUIZ 🎓'
    ]
  },
  {
    id: 'freelance', emoji: '🌱', title: 'Freelance Evolution',
    deadline: 'John\'s Community · Ongoing', cls: 'i4',
    tasks: [
      DIVIDER + 'Module 1 — March 2026 · Front-End Funnel',
      'Watch: HUB Alignment Session',
      'Watch: Front-End Funnel Automation (Evolution Session)',
      'Tutorial: Buy a Domain Name on GoDaddy',
      'Tutorial: Create a GoHighLevel Account',
      'Tutorial: Cancel GHL Free Trial (if needed)',
      'Tutorial: Register to a Payment Platform',
      'Tutorial: Generate Checkout Links',
      'Tutorial: Create a Checkout Page',
      'Tutorial: Connect Checkout Link to Sales Page',
      'Tutorial: Create an Account on Resend',
      'Tutorial: Connect a Domain to Resend',
      'Tutorial: Integrate Resend to the CRM',
      'Tutorial: Automatically Connect Domain to CRM',
      'Tutorial: Manually Connect Domain to CRM',
      'Tutorial: Connect Domain to Sales Page',
      'Tutorial: Create a Course in GHL LMS',
      'Tutorial: Create Confirmation Email Templates',
      'Tutorial: Create Confirmation Email That Gives Instant Access',
      DIVIDER + 'Module 2 — February 2026 · Front-End Offer',
      'Watch: Write Your Front End Offer Sales Page',
      'Guide: Creating Courses with Ease',
      'Guide: Klaviyo List Segmentation Masterclass',
      DIVIDER + 'Module 3 — January 2026 · Offer Design',
      'Watch: Designing a Front-End Offer That Sells Your Service',
      'Watch: Front-End Offer Creation Q&A',
      'Guide: How to Monetize Your SOPs',
      'Guide: How Smart Copywriters Use AI to Earn More',
      'Guide: Create a Premium Packaged Service in 1 Hour (Part 1)',
      'Guide: Create a Premium Packaged Service in 1 Hour (Part 2)',
      'Guide: Introduction to Productizing Your Freelance Service',
      'Strategy: Strategy Finder for Freelancers',
      'Strategy: LinkedIn Attraction Marketing Strategy',
      'Strategy: The Shift from SEO to AEO — Becoming Visible on AI',
      DIVIDER + 'Module 4 — December 2025 · Offers & AI',
      'Watch: How to Create Your Own GPT (+ Sell It to Clients)',
      'Guide: Generate Quality Images Using AI',
      'Guide: How to Audit a Prospect\'s Instagram Page',
      'Guide: Ecommerce Email Training',
      'Guide: Content Distribution Checklist for Virality',
      'Guide: Script for Giving Away Your Client Getting GPT',
      'Strategy: How to Turn Simple Offers Into a Movement',
      'Strategy: Creating Better Offers by Asking One Question'
    ]
  }
];

// ── STATE ─────────────────────────────────────────────
// Days 1-6 of GHL are pre-marked as done (indices 0-5)
let state = JSON.parse(localStorage.getItem('nonsteph_hq') || 'null');
if (!state) {
  state = { log: [] };
  INITIATIVES.forEach(init => {
    state[init.id] = { done: init.id === 'ghl' ? [0,1,2,3,4,5] : [] };
  });
} else {
  INITIATIVES.forEach(init => {
    if (!state[init.id]) state[init.id] = { done: init.id === 'ghl' ? [0,1,2,3,4,5] : [] };
  });
  if (!state.log) state.log = [];
}

function save() { localStorage.setItem('nonsteph_hq', JSON.stringify(state)); }

// ── HELPERS ───────────────────────────────────────────
function isDiv(task) { return task.startsWith(DIVIDER); }

function getStats(init) {
  const real = init.tasks.filter(t => !isDiv(t));
  const done = real.filter((t, ri) => {
    const actualIdx = init.tasks.indexOf(t);
    return (state[init.id]?.done || []).includes(actualIdx);
  });
  return { total: real.length, done: done.length };
}

// ── COUNTDOWNS ────────────────────────────────────────
function updateCountdowns() {
  const now = new Date();
  [['daysMothers','2026-05-11'],['daysBf','2026-05-22'],['daysBirthday','2026-05-25']].forEach(([id, d]) => {
    const diff = Math.ceil((new Date(d) - now) / 86400000);
    document.getElementById(id).textContent = diff > 0 ? diff : '🎉';
  });
}

// ── MASTER BAR ────────────────────────────────────────
function updateMaster() {
  let total = 0, done = 0;
  INITIATIVES.forEach(init => { const s = getStats(init); total += s.total; done += s.done; });
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('masterFill').style.width = pct + '%';
  document.getElementById('totalDone').textContent = done;
  document.getElementById('totalAll').textContent = total;
  const msgs = [
    [0, "0% — let's go Stephie! 🚀"],
    [25, `${pct}% — you're just getting started! 🔥`],
    [50, `${pct}% — momentum is building! 💪`],
    [75, `${pct}% — over halfway there! ⚡`],
    [99, `${pct}% — almost there, you're so close!! 🙌`],
    [100, '100% — YOU DID IT!! Happy Birthday! 🎂🎉']
  ];
  const msg = msgs.reverse().find(([threshold]) => pct >= threshold);
  document.getElementById('overallMsg').textContent = msg ? msg[1] : '';
}

// ── CONFETTI ─────────────────────────────────────────
function confetti(x, y) {
  const colors = ['#9691ED','#F2ACEB','#BEE5EE','#B89CED','#FFF5D4','#7ecfa0'];
  const burst = document.createElement('div');
  burst.className = 'confetti-burst';
  document.body.appendChild(burst);
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.cssText = `left:${x+(Math.random()-.5)*70}px;top:${y+(Math.random()-.5)*30}px;background:${colors[i%colors.length]};animation-delay:${Math.random()*.2}s;animation-duration:${.9+Math.random()*.5}s`;
    burst.appendChild(p);
  }
  setTimeout(() => burst.remove(), 1500);
}

// ── RENDER ────────────────────────────────────────────
function renderInitiatives() {
  const anchor = document.querySelector('.section-label');
  INITIATIVES.forEach(init => {
    const s = getStats(init);
    const pct = s.total ? Math.round(s.done/s.total*100) : 0;
    const doneDone = state[init.id]?.done || [];

    const el = document.createElement('div');
    el.className = `initiative ${init.cls}`;
    el.id = `init-${init.id}`;

    const tasksHTML = init.tasks.map((task, i) => {
      if (isDiv(task)) {
        return `<div class="task-divider">${task.replace(DIVIDER,'')}</div>`;
      }
      const isDone = doneDone.includes(i);
      return `
        <div class="task-item${isDone ? ' done' : ''}" onclick="toggleTask('${init.id}',${i},event)">
          <div class="task-check">
            <svg viewBox="0 0 12 10" fill="none"><polyline points="1,5 4,8 11,1"/></svg>
          </div>
          <div class="task-text">${task}</div>
        </div>`;
    }).join('');

    el.innerHTML = `
      <div class="init-header" onclick="toggleInit('${init.id}')">
        <div class="init-top">
          <div class="init-title-row">
            <span class="init-emoji">${init.emoji}</span>
            <div>
              <div class="init-title">${init.title}</div>
              <div class="init-deadline">${init.deadline}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center">
            <div class="init-pct" id="pct-${init.id}">${pct}%</div>
            <div class="init-chevron">▼</div>
          </div>
        </div>
        <div class="init-bar"><div class="init-fill" id="bar-${init.id}" style="width:${pct}%"></div></div>
      </div>
      <div class="task-list" id="tasks-${init.id}">${tasksHTML}</div>`;

    anchor.after(el);
  });
}

function toggleInit(id) {
  document.getElementById(`init-${id}`).classList.toggle('open');
}

function toggleTask(initId, taskIdx, e) {
  const init = INITIATIVES.find(i => i.id === initId);
  if (isDiv(init.tasks[taskIdx])) return;

  const done = state[initId].done;
  const idx = done.indexOf(taskIdx);
  if (idx === -1) { done.push(taskIdx); confetti(e.clientX, e.clientY); }
  else { done.splice(idx, 1); }
  save();
  refreshUI();
}

function refreshUI() {
  INITIATIVES.forEach(init => {
    const s = getStats(init);
    const pct = s.total ? Math.round(s.done/s.total*100) : 0;
    const doneDone = state[init.id]?.done || [];

    document.getElementById(`pct-${init.id}`).textContent = pct + '%';
    document.getElementById(`bar-${init.id}`).style.width = pct + '%';

    const taskEls = document.querySelectorAll(`#tasks-${init.id} .task-item`);
    let elIdx = 0;
    init.tasks.forEach((task, i) => {
      if (isDiv(task)) return;
      const el = taskEls[elIdx++];
      if (!el) return;
      if (doneDone.includes(i)) el.classList.add('done');
      else el.classList.remove('done');
    });
  });
  updateMaster();
}

// ── LOG ───────────────────────────────────────────────
function addLog() {
  const input = document.getElementById('logInput');
  const text = input.value.trim();
  if (!text) return;
  const date = new Date().toLocaleDateString('en-US', { month:'short', day:'numeric' });
  state.log.unshift({ date, note: text });
  if (state.log.length > 30) state.log.pop();
  save();
  input.value = '';
  renderLog();
}

function renderLog() {
  const el = document.getElementById('logEntries');
  if (!state.log.length) {
    el.innerHTML = '<div class="log-empty">No entries yet — log your first win! 🌟</div>';
    return;
  }
  el.innerHTML = state.log.map(e => `
    <div class="log-entry">
      <div class="log-dot"></div>
      <div style="flex:1">
        <div class="log-date">${e.date}</div>
        <div class="log-note">${e.note}</div>
      </div>
    </div>`).join('');
}

// ── BOOT ──────────────────────────────────────────────
updateCountdowns();
renderInitiatives();
updateMaster();

document.body.insertAdjacentHTML('beforeend', `
  <div class="section-label" style="margin-top:24px;">Progress Log</div>
  <div class="log-section">
    <div class="log-box">
      <div class="log-input-row">
        <input id="logInput" class="log-input" placeholder="Log a win, a note, a milestone..." onkeydown="if(event.key==='Enter')addLog()">
        <button class="log-btn" onclick="addLog()">+ LOG</button>
      </div>
      <div class="log-entries" id="logEntries"></div>
    </div>
  </div>`);

renderLog();
// Open GHL initiative by default since that's active today
document.getElementById('init-ghl').classList.add('open');
</script>

</body>
</html>
